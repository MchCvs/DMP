<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E3-3 Consulter</title><style>body{font-family:Arial;margin:20px;max-width:1000px}table{border-collapse:collapse;width:100%}td{border:1px solid #bdc3c7;padding:10px}.ok{background:#d5f4e6}.warn{background:#fdeaa8}.fail{background:#fadbd8}</style><script src=i18n.js></script></head><body>
<h1>📊 E3-3: Consulter Rapports</h1>
<table id=reports><tr><th>Date</th><th>Statut</th><th>Score</th></tr></table>
<script>
async function load(){
  let r=await fetch('/api/e3_3');
  let d=await r.json();
  let table=document.getElementById('reports');
  d.reports?.forEach(rep=>{
    let tr=document.createElement('tr');
    let cls=rep.score>80?'ok':rep.score>50?'warn':'fail';
    tr.innerHTML=`<td>${rep.date}</td><td class=${cls}>${rep.status}</td><td>${rep.score}</td>`;
    table.appendChild(tr);
  });
}
load();
</script>
</body></html>
