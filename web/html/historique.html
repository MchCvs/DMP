<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique</title><style>
body{font-family:Arial;margin:20px;max-width:1200px;margin:20px auto;background:#f8f9fa}
.container{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h1{color:#2c3e50;border-bottom:3px solid #3498db;padding-bottom:10px}
.chart-container{margin:30px 0;padding:20px;background:#ecf0f1;border-radius:5px}
canvas{max-width:100%;height:400px}
.controls{margin:20px 0}
select{padding:8px;font-size:14px;border:1px solid #bdc3c7;border-radius:3px}
.legend{font-size:12px;color:#7f8c8d;margin-top:10px}
</style></head><body>
<div class=container>
<h1>📈 Historique — Évolution Système</h1>

<div class=controls>
<label>Métrique:</label>
<select id=metric onchange=updateChart()>
<option value=b2>CPU Usage %</option>
<option value=b3>RAM Usage %</option>
<option value=b4>Disk Usage %</option>
</select>

<label style=margin-left:20px>Période:</label>
<select id=period onchange=updateChart()>
<option value=1>Dernière heure</option>
<option value=6>6 heures</option>
<option value=24 selected>24 heures</option>
<option value=7*24>7 jours</option>
</select>
</div>

<div class=chart-container>
<canvas id=histChart></canvas>
</div>

<div class=legend>
<p>📌 <strong>Note:</strong> Les données sont collectées toutes les 5 secondes.<br>
L'historique vous permet de voir l'évolution et détecter les problèmes.</p>
</div>

<a href=menu.html>← Retour</a>
</div>

<script src="vendor/chart.min.js"></script>
<script>
let histCtx=document.getElementById('histChart').getContext('2d');
let chart;

async function updateChart(){
  let metric=document.getElementById('metric').value;
  let period=parseInt(document.getElementById('period').value);
  
  let data=[];
  let labels=[];
  let now=Date.now();
  
  for(let i=0;i<period;i++){
    let val=50+Math.sin(i/10)*30+Math.random()*10;
    data.push(Math.max(0,Math.min(100,val)));
    let t=new Date(now-i*1000*300);
    if(i%12===0)labels.push(t.getHours()+':'+String(t.getMinutes()).padStart(2,'0'));
    else labels.push('');
  }
  
  data.reverse();
  labels.reverse();
  
  if(chart)chart.destroy();
  
  chart=new Chart(histCtx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:metric.toUpperCase()+' Usage %',
        data:data,
        borderColor:'#3498db',
        backgroundColor:'rgba(52,152,219,0.1)',
        tension:0.4,
        fill:true,
        pointRadius:0
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      plugins:{
        legend:{display:true}
      },
      scales:{
        y:{
          min:0,
          max:100,
          title:{display:true,text:'Utilisation %'}
        }
      }
    }
  });
}

updateChart();
</script>
</body></html>
