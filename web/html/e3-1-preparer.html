<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E3-1 Préparer</title><style>body{font-family:Arial;margin:20px;max-width:800px}h1{color:#3498db}.section{margin:20px 0;border:1px solid #ddd;padding:15px;border-radius:5px}</style><script src=i18n.js></script></head><body>
<h1>📋 E3-1: Préparer Rapport</h1>
<div class=section>
<h2>Comprendre</h2>
<p id=e3-comprendre>Chargement...</p>
</div>
<div class=section>
<h2>Observations</h2>
<pre id=e3-observations>Chargement...</pre>
</div>
<div class=section>
<h2>Résultat</h2>
<p id=e3-resultat>Chargement...</p>
</div>
<div class=section>
<h2>Données Techniques</h2>
<pre id=e3-technique>Chargement...</pre>
</div>
<script>
async function loadE3(){
  let r=await fetch('/api/e3_1');
  let d=await r.json();
  document.getElementById('e3-comprendre').textContent=d.comprendre||'N/A';
  document.getElementById('e3-observations').textContent=d.observations||'N/A';
  document.getElementById('e3-resultat').textContent=d.resultat||'N/A';
  document.getElementById('e3-technique').textContent=JSON.stringify(d.informations_techniques,null,2);
}
loadE3();
setInterval(loadE3,5000);
</script>
</body></html>
