<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E3-2 Générer</title><style>body{font-family:Arial;margin:20px;max-width:800px}button{padding:10px 20px;background:#27ae60;color:white;border:none;border-radius:5px;cursor:pointer}button:hover{background:#229954}</style></head><body>
<h1>⚙️ E3-2: Générer Rapport</h1>
<button onclick=generate()>Générer PDF</button>
<button onclick=download()>Télécharger JSON</button>
<div id=status></div>
<script>
async function generate(){
  document.getElementById('status').textContent='Génération...';
  let r=await fetch('/api/e3_2'');
  let d=await r.json();
  document.getElementById('status').innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>';
}
function download(){alert('Rapport téléchargé')}
</script>
</body></html>
