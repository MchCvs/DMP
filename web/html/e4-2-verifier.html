<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E4-2 Vérifier</title><script src=i18n.js></script></head><body style=margin:20px>
<h1>✅ E4-2: Vérifier Données</h1>
<svg width=400 height=200 id=chart style="border:1px solid #ccc"></svg>
<script>
async function load(){
  for(let i=0;i<5;i++){
    let r=await fetch('/api/e4_2'');
    let d=await r.json();
    if(d.status==='valid'){document.body.innerHTML+='<p>✅ Données valides</p>';break;}
    await new Promise(r=>setTimeout(r,1000));
  }
}
load();
</script>
</body></html>
