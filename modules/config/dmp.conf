# ==================================================
# Debian Maintenance Professional
# Configuration générale
# ==================================================

# Identité du projet
DMP_NAME="Debian Maintenance Professional"
DMP_VERSION="1.7.0"
DMP_AUTHOR="Thierry CHEVASSUS"
DMP_ORIGIN="La Réunion, France"
DMP_DESCRIPTION="Outil libre de maintenance et diagnostic Debian Linux"
DMP_COPYRIGHT="© 2026 Thierry CHEVASSUS"

# Langue
DEFAULT_LANGUAGE="en"
LANGUAGE="fr"

# Répertoires
# Données de l'utilisateur (rapports, historique) : XDG, jamais dans le paquet
DMP_DATA="${DMP_DATA:-${XDG_DATA_HOME:-$HOME/.local/share}/dmp}"
REPORT_DIR="${REPORT_DIR:-$DMP_DATA/reports}"

# SSD principal détecté automatiquement
AUTO_DETECT_DISKS=true

# Nettoyage automatique
CLEAN_LOGS_DAYS=30

# Niveau d'affichage
# 1 = simple
# 2 = avancé
# 3 = expert
MODE=2
